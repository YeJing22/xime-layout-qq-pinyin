id: qq_pinyin
name: QQ拼音版布局
author: YeJing22
description: 只改九键、英文 26 键与数字键盘的键位和手势。九键数字键下滑直达复制/粘贴/剪切/换行/全选，5 键四向滑移光标，7/8/9 上滑出中文标点；英文 q-p 上滑数字、a-l 上滑标点、z-m 上滑符号；数字键盘左栏四则运算、右侧竖排功能键。不含配色与字体，套用后原主题不变。
tags: [布局, 快捷键]
