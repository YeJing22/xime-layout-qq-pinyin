metadata:             # 版本信息（可选，自动生成，一般无需手改）
  app_name: Xime
  app_version: ">=3.0.0"
  platform: android
  config_version: 1

keyboard:
  number:
    layout:
      left:
        - ["+", "-", "*", "/"]
        - space_bar
      rows:
        - [1, 2, 3]
        - [4, 5, 6]
        - [7, 8, 9]
        - [open_symbols, 0, back]
      right: [delete,".", emoji, enter]

  qwerty_en:                     # 英文 26 键键盘
    layout:
      rows:                   # 决定键位：行内可混排字母与功能键
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        - [open_symbols, earth, ",", space, ".", mode_change, enter]
    keys:                     # 决定行为：每个键的手势
      q: { tap: { label: "q", value: "q", display: "both", bubble: false }, swipe_up: { label: "1", value: "1", display: "both", bubble: false }, long_press: { display: "bubble", values: ["q", "Q"] } }
      w: { tap: { label: "w", value: "w", display: "both", bubble: false }, swipe_up: { label: "2", value: "2", display: "both", bubble: false }, long_press: { display: "bubble", values: ["w", "W"] } }
      e: { tap: { label: "e", value: "e", display: "both", bubble: false }, swipe_up: { label: "3", value: "3", display: "both", bubble: false }, long_press: { display: "bubble", values: ["e", "E", "è", "é", "ê", "ë"] } }
      r: { tap: { label: "r", value: "r", display: "both", bubble: false }, swipe_up: { label: "4", value: "4", display: "both", bubble: false }, long_press: { display: "bubble", values: ["r", "R"] } }
      t: { tap: { label: "t", value: "t", display: "both", bubble: false }, swipe_up: { label: "5", value: "5", display: "both", bubble: false }, long_press: { display: "bubble", values: ["t", "T"] } }
      y: { tap: { label: "y", value: "y", display: "both", bubble: false }, swipe_up: { label: "6", value: "6", display: "both", bubble: false }, long_press: { display: "bubble", values: ["y", "Y", "ÿ"] } }
      u: { tap: { label: "u", value: "u", display: "both", bubble: false }, swipe_up: { label: "7", value: "7", display: "both", bubble: false }, long_press: { display: "bubble", values: ["u", "U", "ù", "ú", "û", "ü"] } }
      i: { tap: { label: "i", value: "i", display: "both", bubble: false }, swipe_up: { label: "8", value: "8", display: "both", bubble: false }, long_press: { display: "bubble", values: ["i", "I", "ì", "í", "î", "ï"] } }
      o: { tap: { label: "o", value: "o", display: "both", bubble: false }, swipe_up: { label: "9", value: "9", display: "both", bubble: false }, long_press: { display: "bubble", values: ["o", "O", "ò", "ó", "ô", "õ", "ö", "ø"] } }
      p: { tap: { label: "p", value: "p", display: "both", bubble: false }, swipe_up: { label: "0", value: "0", display: "both", bubble: false }, long_press: { display: "bubble", values: ["p", "P"] } }
      a: { tap: { label: "a", value: "a", display: "both", bubble: false }, swipe_up: { label: "～", value: "~", bubble: false }, long_press: { display: "bubble", values: ["a", "A", "à", "á", "â", "ã", "ä", "å", "æ"] } }
      s: { tap: { label: "s", value: "s", display: "both", bubble: false }, swipe_up: { label: "／", value: "/", bubble: false }, long_press: { display: "bubble", values: ["s", "S", "ß"] } }
      d: { tap: { label: "d", value: "d", display: "both", bubble: false }, swipe_up: { label: "：", value: ":", bubble: false }, long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: { label: "f", value: "f", display: "both", bubble: false }, swipe_up: { label: "；", value: ";", bubble: false }, long_press: { display: "bubble", values: ["f", "F"] } }
      g: { tap: { label: "g", value: "g", display: "both", bubble: false }, swipe_up: { label: "“", value: "“", bubble: false }, long_press: { display: "bubble", values: ["g", "G"] } }
      h: { tap: { label: "h", value: "h", display: "both", bubble: false }, swipe_up: { label: "”", value: "”", bubble: false }, long_press: { display: "bubble", values: ["h", "H"] } }
      j: { tap: { label: "j", value: "j", display: "both", bubble: false }, swipe_up: { label: "－", value: "-", bubble: false }, long_press: { display: "bubble", values: ["j", "J"] } }
      k: { tap: { label: "k", value: "k", display: "both", bubble: false }, swipe_up: { label: "（", value: "(", bubble: false }, long_press: { display: "bubble", values: ["k", "K"] } }
      l: { tap: { label: "l", value: "l", display: "both", bubble: false }, swipe_up: { label: "）", value: ")", bubble: false }, long_press: { display: "bubble", values: ["l", "L"] } }
      z: { tap: { label: "z", value: "z", display: "both", bubble: false }, swipe_up: { label: "＊", value: "*", bubble: false }, long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { tap: { label: "x", value: "x", display: "both", bubble: false }, swipe_up: { label: "＠", value: "@", bubble: false }, long_press: { display: "bubble", values: ["x", "X"] } }
      c: { tap: { label: "c", value: "c", display: "both", bubble: false }, swipe_up: { label: "、", value: "、", bubble: false }, long_press: { display: "bubble", values: ["c", "C", "ç"] } }
      v: { tap: { label: "v", value: "v", display: "both", bubble: false }, swipe_up: { label: "？", value: "?", bubble: false }, long_press: { display: "bubble", values: ["v", "V"] } }
      b: { tap: { label: "b", value: "b", display: "both", bubble: false }, swipe_up: { label: "！", value: "!", bubble: false }, long_press: { display: "bubble", values: ["b", "B"] } }
      n: { tap: { label: "n", value: "n", display: "both", bubble: false }, swipe_up: { label: "％", value: "%", bubble: false }, long_press: { display: "bubble", values: ["n", "N", "ñ"] } }
      m: { tap: { label: "m", value: "m", display: "both", bubble: false }, swipe_up: { label: "＃", value: "#", bubble: false }, long_press: { display: "bubble", values: ["m", "M"] } }
      delete: { tap: { action: "delete", bubble: false }, swipe_up: { action: "clear_all", label: "上滑清空", bubble: false }, swipe_down: { action: "undo_clear", label: "下滑撤回", bubble: false }, swipe_left: { action: "command", value: "clear_composition" }, swipe_right: { action: "command", value: "clear_composition" } }
      ",": { width: 0.5, tap: { label: ",", value: ",", bubble: false } }
      earth: { width: 0.8, tap: { label: "@language", action: "toggle_ascii", bubble: false }, long_press: { display: "bubble", values: [{ label: "选择输入法", action: "command", value: "show_ime_picker" }] } }
      shift: { tap: { action: command, value: shift_single }, double_tap: { action: command, value: shift_caps } }
      space: { width: 1.2, tap: { action: space }, long_press: { values: [ { action: repeat_space, value: 5 } ] } }
      open_symbols: { width: 0.8 }
      ".": { width: 0.5, tap: { label: ".", value: ".", bubble: false } }
      mode_change: { width: 0.8, tap: { label: "123", action: command, value: mode_change_number, bubble: false } }
      enter: { width: 0.7, tap: { label: "Enter", action: "enter", bubble: false } }
      

  t9:
    schemas: [wanxiang_t9i]     #单独声明了默认匹配不到的万象元书方案
    layout:
      left: [candidates, symbol]
      rows:
        - ["1", "2", "3"]
        - ["4", "5", "6"]
        - ["7", "8", "9"]
        - [earth, space, number]
      right: [delete, clear, enter]
    keys:
      space: { width: 1.5, tap: { action: space }, long_press: { values: [ { action: none } ] } } 
      "7": { swipe_up: { label: "逗号", action: "send_rime", value: "，", display: "key", bubble: false } }
      "8": { swipe_up: { label: "冒号", action: "send_rime", value: "：", display: "key", bubble: false } }
      "9": { swipe_up: { label: "句号", action: "send_rime", value: "。", display: "key", bubble: false } }
      "4": { swipe_down: { label: "全选", action: "select_all", bubble: false } }
      "5": { swipe_up: { label: "行首", action: "line_start", bubble: false }, swipe_left: { label: "←", action: "cursor_left", bubble: false }, swipe_right: { label: "→", action: "cursor_right", bubble: false }, swipe_down: { label: "行尾", action: "line_end", bubble: false } }
       # 在5键上单次左滑右滑会精确移动1字符，虽然line_start和end预期行为是段首段尾、实际是行首行尾，但也挺实用的就干脆直接这样用了
      "6": { swipe_down: { label: "粘贴", action: "paste", bubble: false } }
      "3": { swipe_down: { label: "剪切", action: "cut", bubble: false } }
      "2": { swipe_down: { label: "换行", action: "newline", display: "key", bubble: false } }
      "1": { swipe_down: { label: "复制", action: "copy", bubble: false } }
